name: iOS Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Check Xcode
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen || brew upgrade xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned .app
        run: |
          xcodebuild -project School13.xcodeproj -scheme School13 -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
      - name: Verify app
        run: test -d build/Build/Products/Release-iphoneos/School13.app
      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/School13.app Payload/
          zip -r School13-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: School13-unsigned-ipa
          path: School13-unsigned.ipa
